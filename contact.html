<!DOCTYPE html>
<html lang="en">
<head>
  <title>About – Melt Me</title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/vendor.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant&family=Jost&display=swap" rel="stylesheet">
</head>

<body>
<!-- NAVBAR -->
<header id="header" class="site-header">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">

      <!-- LOGO -->
      <a class="navbar-brand" href="index.html">
        <img src="images/transparentLogo.png"
             class="logo img-fluid"
             alt="Melt Me"
             style="max-height:20px;">
      </a>

      <!-- TOGGLER -->
      <button class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
              aria-controls="navbarNav"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- NAV LINKS + CART -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">

          <!-- Standard Pages -->
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>

          <!-- Cart Dropdown (immediately after nav links) -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="cartDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Cart (<span id="cart-count">0</span>)
            </a>
            <ul class="dropdown-menu dropdown-menu-end p-3" aria-labelledby="cartDropdown" style="min-width:300px;">
              <li class="d-flex justify-content-between mb-2">
                <span>Your cart</span>
                <span class="badge bg-dark" id="cart-badge">0</span>
              </li>
              <li>
                <ul class="list-group mb-3" id="cart-items">
                  <li class="list-group-item text-muted text-center">Your cart is empty</li>
                </ul>
              </li>
              <li>
                <a href="index.html" class="btn btn-dark w-100 mb-2">View Cart</a>
                <a href="index.html" class="btn btn-primary w-100">Checkout</a>
              </li>
            </ul>
          </li>

          <!-- Optional: Search -->
          <li class="nav-item my-2 my-lg-0">
            <input type="search"
                   class="form-control form-control-sm"
                   placeholder="Search"
                   aria-label="Search"
                   style="width:180px;">
          </li>

        </ul>
      </div>
    </div>
  </nav>
</header>


  <div class="container py-5">
    <div class="row justify-content-center">

      <div class="col-lg-4 col-md-6 col-sm-8">
        <div class="footer-menu contact-item text-center">

          <h4 class="widget-title pb-3">Contact Info</h4>

          <ul class="menu-list list-unstyled mb-4">
            <li class="pb-2">
              123 Main Street<br>
              Somewhere City, Country
            </li>
            <li class="pb-2">+1 800 123 4567</li>
            <li class="pb-2">support@example.com</li>
          </ul>

          <form
            action="https://formspree.io/f/XXXXYYYY"
            method="POST"
            class="mx-auto"
            style="max-width: 280px;">

            <!-- Name -->
            <div class="input-box mb-3">
              <input
                type="text"
                name="name"
                class="form-control text-center"
                placeholder="Your Name"
                required>
            </div>

            <!-- Email -->
            <div class="input-box mb-3">
              <input
                type="email"
                name="email"
                class="form-control text-center"
                placeholder="Your Email"
                required>
            </div>

            <!-- Message -->
            <div class="input-box mb-4">
              <textarea
                name="message"
                class="form-control text-center"
                rows="6"
                placeholder="Your Message"
                required></textarea>
            </div>

            <button type="submit" class="btn btn-dark w-100">
              Send Message
            </button>
          </form>

          <div id="bot-response" class="mt-3 text-muted" style="display:none;"></div>

        </div>
      </div>

    </div>

    <div class="text-center mt-5">
      <a href="index.html" class="btn btn-dark px-4 py-2">
        ← Back to Home
      </a>
    </div>
  </div>

  <!-- SCRIPTS (Clean Order) -->
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/script.js"></script>
  
</body>
</html>
